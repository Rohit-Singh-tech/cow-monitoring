services:
  # Backend Web Service
  - type: web
    name: cow-logger-backend
    env: python
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: MODEL_PATH
        value: "../cow_ml_models/trained_models/cow_health_xgboost_models.pkl"
      # Ensure DATABASE_URL is managed in Render dashboard (do not sync it from code)
      - key: DATABASE_URL
        sync: false

  # Frontend Static Site
  - type: web
    name: cow-logger-frontend
    env: static
    rootDir: frontend
    region: singapore
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
    routes:
      # Proxy API requests to the backend service
      # NOTE: In Render, the destination URL needs to be the actual URL of the backend.
      # You may need to update this URL once the backend is deployed if Render assigns a random suffix.
      - type: rewrite
        source: /api/*
        destination: https://cow-logger-backend.onrender.com/api/*
      # SPA fallback for React
      - type: rewrite
        source: /*
        destination: /index.html
